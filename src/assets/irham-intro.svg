<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 390" role="img" aria-labelledby="title desc">
  <title id="title">IRHAM ENTERPRISE</title>
  <desc id="desc">An original red and orange international trade emblem with a globe, cargo vessel and forward-moving trade ribbons.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E45B3B"/>
      <stop offset="1" stop-color="#9E2929"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C16D"/>
      <stop offset="1" stop-color="#D77A36"/>
    </linearGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D94D36"/>
      <stop offset="1" stop-color="#A52E2A"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 850ms ease-out forwards; }
      .reveal { opacity: 0; animation: reveal 500ms ease-out forwards; animation-delay: 650ms; }
      .rise { opacity: 0; transform: translateY(8px); animation: rise 550ms ease-out forwards; animation-delay: 850ms; }
      .sweep { transform-origin: 250px 175px; animation: sweep 900ms cubic-bezier(.2,.75,.25,1) 250ms both; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes reveal { to { opacity: 1; } }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes sweep { from { opacity: 0; transform: translateX(-15px) scale(.94); } to { opacity: 1; transform: translateX(0) scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; }
        .draw { stroke-dashoffset: 0; }
        .reveal, .rise { opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <!-- Quiet orbital rings -->
  <g fill="none" stroke="#E9DED2" stroke-width="1.4" opacity=".75">
    <circle cx="250" cy="145" r="111"/>
    <circle cx="250" cy="145" r="96" stroke-dasharray="2 8"/>
  </g>

  <!-- Globe -->
  <g fill="none" stroke="url(#globe)" stroke-linecap="round" stroke-linejoin="round">
    <circle class="draw" cx="250" cy="137" r="69" stroke-width="6"/>
    <path class="draw" d="M181 137h138M250 68c-31 23-31 115 0 138M250 68c31 23 31 115 0 138M193 104q57 19 114 0M193 170q57-19 114 0" stroke-width="3.5"/>
  </g>

  <!-- Trade / cargo motif -->
  <g class="sweep">
    <path d="M166 171h59l17 17h76l19-19h14l-25 34H193z" fill="url(#red)"/>
    <path d="M220 169v-32h39v47h-20z" fill="url(#orange)"/>
    <path d="M226 143h27v7h-27zm0 12h27v7h-27z" fill="#FFF7EC" opacity=".95"/>
    <path d="M263 187q43-34 88-55-12 28-43 51 27-9 49-4-33 35-83 31z" fill="url(#red)"/>
    <path d="M277 188q34-25 62-40" fill="none" stroke="url(#orange)" stroke-width="4" stroke-linecap="round"/>
    <path d="M192 207q58 16 116 0" fill="none" stroke="#D77A36" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- Wordmark -->
  <g class="reveal">
    <text x="250" y="267" text-anchor="middle" fill="#A52E2A" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700" letter-spacing="3.2">IRHAM</text>
    <text x="250" y="296" text-anchor="middle" fill="#292B2B" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="6.5">ENTERPRISE</text>
    <path d="M169 310h162" stroke="url(#orange)" stroke-width="2"/>
  </g>
  <g class="rise">
    <text x="250" y="333" text-anchor="middle" fill="#77716A" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="2.1">GLOBAL TRADE  ·  BUSINESS CONNECTIONS</text>
  </g>
</svg>
